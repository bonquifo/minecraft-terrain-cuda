// In-game recording mod: in a dev client, chunks of a chosen region are filled from
// the GPU generator's output (instead of vanilla's noise fill and surface rules), and
// a scripted camera flies the same path as the GPU renderer's flythrough while the
// frames are captured. Runs on the author's machine only; nothing from the game is
// committed.
plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
}

java {
	toolchain { languageVersion = JavaLanguageVersion.of(25) }
}

// runClient records the flight: GPU dump of the region, palette/biome names, camera path, output.
// -Pserve=false records the vanilla control run (same path, every chunk generated by the game); -Pout names the output.
def data = rootProject.file('../data').canonicalPath.replace(File.separator, '/')
def serve = project.findProperty('serve') ?: 'true'
def outName = project.findProperty('out') ?: 'ingame_raw'
def structures = project.findProperty('structures') ?: 'false'
loom {
	runs {
		client {
			vmArgs "-Xmx12G", "-Dmccuda.dump=${data}/videos/ingame_dump", "-Dmccuda.terrain=${data}/gamedata/26.3/overworld_terrain.json",
				"-Dmccuda.path=${data}/videos/flythrough_path.txt", "-Dmccuda.out=${data}/videos/${outName}.mp4",
				"-Dmccuda.serve=${serve}", "-Dmccuda.structures=${structures}"
			programArgs "--width", "1280", "--height", "720"
		}
	}
}
